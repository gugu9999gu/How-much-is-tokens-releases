name: Bootstrap v1.0.23 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      SOURCE_REPOSITORY: gugu9999gu/How-much-is-tokens
      SOURCE_COMMIT: 1ac78c01371ca8b8d8bd765d9e8f6bdbcb4ff58a
      RELEASE_TAG: v1.0.23

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          path: release-repo

      - name: Checkout verified source commit
        uses: actions/checkout@v4
        with:
          repository: gugu9999gu/How-much-is-tokens
          ref: 1ac78c01371ca8b8d8bd765d9e8f6bdbcb4ff58a
          path: source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Verify source version
        working-directory: source
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($version -ne '1.0.23') { throw "Expected source version 1.0.23, got $version" }
          npx --no-install leerness --version

      - name: Run regression tests
        working-directory: source
        run: npm test

      - name: Smoke test Windows secure storage
        working-directory: source
        run: npm run test:secure-secrets

      - name: Smoke test renderer
        working-directory: source
        run: npm run test:renderer-layout

      - name: Build Windows portable executable
        working-directory: source
        run: npm run dist

      - name: Generate checksum and release notes
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -LiteralPath 'source\dist' -Filter '*-portable.exe' -File | Select-Object -First 1
          if (!$artifact) { throw 'Portable EXE not found' }
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
          @(
            '# How much is tokens v1.0.23',
            '',
            'Windows portable release built from the verified development source commit:',
            '',
            '`1ac78c01371ca8b8d8bd765d9e8f6bdbcb4ff58a`',
            '',
            'The build passed the project regression suite, Windows secure-storage smoke test, and Electron renderer smoke test before publishing.',
            '',
            'Verify the executable with the attached `SHA256SUMS.txt` before running it.'
          ) | Set-Content -LiteralPath 'RELEASE_NOTES.md' -Encoding utf8
          "ARTIFACT_PATH=$($artifact.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish v1.0.23 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$env:RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          }
          gh release create $env:RELEASE_TAG `
            "$env:ARTIFACT_PATH" `
            'SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --title 'How much is tokens v1.0.23' `
            --notes-file 'RELEASE_NOTES.md'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create release' }
